server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des assets texte.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Fallback SPA : toute route inconnue renvoie index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets fingerprintés (hash dans le nom) : cache long et immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker et manifeste : jamais en cache, pour propager les mises à jour.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
    }
}
